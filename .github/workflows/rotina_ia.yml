name: Executar IA de Apostas Diariamente

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  rodar-ia:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Codigo
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Dependencias
        run: |
          pip install pandas scikit-learn

      - name: Rodar Script de IA
        run: python gerar_apostas.py

      - name: Salvar e Atualizar GitHub Pages
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "bot@github.com"
          git add dados_apostas.json
          git commit -m "Atualização automática de apostas diárias" || exit 0
          git push
